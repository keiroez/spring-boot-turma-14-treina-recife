<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos | Gestão de Projetos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a class="brand" href="painel.html">📋 Gestão de Projetos</a>
    <div class="nav-links">
        <a href="usuarios.html">Usuários</a>
        <a href="projetos.html">Projetos</a>
        <a href="tarefas.html">Tarefas</a>
        <span id="usuario-logado" class="usuario-logado"></span>
        <button type="button" id="btn-logout" class="btn btn-sair">Sair</button>
    </div>
</nav>

<main class="container">
    <h1>Projetos</h1>

    <section class="card">
        <h2 id="form-titulo">Novo projeto</h2>
        <form id="form-projeto" class="form-grid">
            <input type="hidden" id="id">
            <label>Nome<input type="text" id="nome" required></label>
            <label>Responsável
                <select id="responsavelId" required></select>
            </label>
            <label class="col-span-2">Descrição<textarea id="descricao" rows="2"></textarea></label>
            <label>Data de início<input type="date" id="dataInicio" required></label>
            <label>Data de conclusão<input type="date" id="dataConclusao"></label>
            <label>Status
                <select id="status">
                    <option value="ATIVO">ATIVO</option>
                    <option value="CONCLUIDO">CONCLUIDO</option>
                    <option value="CANCELADO">CANCELADO</option>
                </select>
            </label>
            <div class="form-acoes">
                <button type="submit" class="btn btn-primario">Salvar</button>
                <button type="button" id="btn-cancelar" class="btn btn-secundario oculto">Cancelar</button>
            </div>
        </form>
        <p id="mensagem" class="mensagem"></p>
    </section>

    <section class="card">
        <table class="tabela">
            <thead>
            <tr>
                <th>ID</th><th>Nome</th><th>Responsável</th><th>Início</th><th>Conclusão</th><th>Status</th><th>Ações</th>
            </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/projetos.js"></script>
</body>
</html>
