<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários | Gestão de Projetos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a class="brand" href="painel.html">📋 Gestão de Projetos</a>
    <div class="nav-links">
        <a href="usuarios.html">Usuários</a>
        <a href="projetos.html">Projetos</a>
        <a href="tarefas.html">Tarefas</a>
        <span id="usuario-logado" class="usuario-logado"></span>
        <button type="button" id="btn-logout" class="btn btn-sair">Sair</button>
    </div>
</nav>

<main class="container">
    <h1>Usuários</h1>

    <section class="card">
        <h2 id="form-titulo">Novo usuário</h2>
        <form id="form-usuario" class="form-grid">
            <input type="hidden" id="id">
            <label>Nome<input type="text" id="nome" required></label>
            <label>CPF<input type="text" id="cpf" maxlength="14" required></label>
            <label>E-mail<input type="email" id="email" required></label>
            <label>Senha<input type="password" id="senha" minlength="6" placeholder="mín. 6 caracteres"></label>
            <label>Data de nascimento<input type="date" id="dataNascimento"></label>
            <label>Status
                <select id="status">
                    <option value="ATIVO">ATIVO</option>
                    <option value="INATIVO">INATIVO</option>
                    <option value="BLOQUEADO">BLOQUEADO</option>
                </select>
            </label>
            <div class="form-acoes">
                <button type="submit" class="btn btn-primario">Salvar</button>
                <button type="button" id="btn-cancelar" class="btn btn-secundario oculto">Cancelar</button>
            </div>
        </form>
        <p id="mensagem" class="mensagem"></p>
    </section>

    <section class="card">
        <table class="tabela">
            <thead>
            <tr>
                <th>ID</th><th>Nome</th><th>CPF</th><th>E-mail</th><th>Status</th><th>Ações</th>
            </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
